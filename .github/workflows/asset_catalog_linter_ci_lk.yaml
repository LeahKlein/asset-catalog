name: 🧪Linter CI
on: 
  push:
    branches:
      - feature/asset_catalog_lk
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./asset_catalog_lk/
    steps:  
    - name: 🔨 Check out repository
      uses: actions/checkout@v4
    # - name: 📌 Set up Python
    #   uses: actions/setup-python@v4
    #   with:
    #     python-version: '3.13'
    - name: ➕ Install flake8
      run: pip install flake8
    - name: ✅ Run flake8
      run: flake8 ./**/*.py
    