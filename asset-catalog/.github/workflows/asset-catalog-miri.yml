name: asset catalog tests

on: 
  push:
    branches:
    - feature/catalog-miri

jobs:
  build: 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./asset-catalog-miri/client
    steps:
     - name: Checkout the code
       uses: actions/checkout@v4

     - name: Use Node.js
       uses: actions/setup-node@v4
       with:
         node-version: '22'
 
     - name: Install dependencies
       run: npm install

     - name: Run Tests
       run: npm run test
