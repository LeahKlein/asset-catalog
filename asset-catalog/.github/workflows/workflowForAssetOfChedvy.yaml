name: workflowForAssetOfChedvy

on:
  push:
    branches: asset-catalog-chedvy

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./asset-catalog-chedvy/client
    steps:
    - name: 🔎Checkout Code
      uses: actions/checkout@v4
    - name: 📍Use node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: 🧩Install dependencies
      run: npm install axios node-async-locks dotenv jest
    - name: ✅Run Tests
      run: npm run test